name: ci

on: [push, pull_request]

jobs:
  # ------------------------------------------------------------ 1. les tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -v

  # -------------------------------------------- 2. l'image, si les tests passent
  image:
    needs: test                       # ne démarre que si le job « test » a réussi
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # autorise l'écriture dans GHCR

    steps:
      - uses: actions/checkout@v4

      # Permet de construire pour ARM sur une machine amd64 (émulation)
      - uses: docker/setup-qemu-action@v3

      # Le constructeur Docker capable de produire plusieurs architectures
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest